services:

  frontend:
    build:
      context: ./pincast-frontend
      dockerfile: Dockerfile
    container_name: pingcast_frontend
    ports:
      - "5173:80"
    networks:
      - pingcast_network
  backend:
    build:
      context: ./pingcast-backend
      dockerfile: Dockerfile
    container_name: pingcast_backend
    volumes:
    - ./pingcast-backend:/var/www/html
    networks:
    - pingcast_network

  scheduler:
    build:
      context: ./pingcast-backend
      dockerfile: Dockerfile
    container_name: pingcast_scheduler
    command: php artisan schedule:work
    volumes:
      - ./pingcast-backend:/var/www/html
    depends_on:
      - backend
    networks:
      - pingcast_network

  nginx:
    image: nginx:alpine
    container_name: pingcast_backend_nginx
    ports:
      - "8000:80"
    volumes:
      - ./pingcast-backend:/var/www/html
      - ./pingcast-backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - pingcast_network


  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: pingcast-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://satinlike-unserviceably-hana.ngrok-free.dev/
      - GENERIC_TIMEZONE=Africa/Lagos
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - pingcast_network


volumes:
  n8n_data:



networks:
  pingcast_network: